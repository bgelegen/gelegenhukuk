<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Gelegen Hukuk Bürosu — sosyal medya paylaşım görseli">
  <title>Gelegen Hukuk Bürosu</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060F1C" />
      <stop offset="60%" stop-color="#0F2038" />
      <stop offset="100%" stop-color="#16304F" />
    </linearGradient>
    <radialGradient id="og-glow" cx="82%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#B4914F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B4914F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />
  <rect x="0" y="0" width="1200" height="6" fill="#B4914F" />

  <!-- Amblem -->
  <g transform="translate(940 315) scale(4.6) translate(-24 -24)" fill="none" stroke="#C9A96A"
