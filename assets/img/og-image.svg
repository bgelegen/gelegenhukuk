    <path d="M24 10v30" />
    <path d="M17 40h14" />
    <path d="M14 44h20" />
    <path d="M8 13h32" />
    <circle cx="24" cy="8.5" r="2.4" />
    <path d="M8 13v5M40 13v5" />
    <path d="M2.5 18h11" />
    <path d="M2.5 18a5.5 5.5 0 0 0 11 0" />
    <path d="M34.5 18h11" />
    <path d="M34.5 18a5.5 5.5 0 0 0 11 0" />
  </g>

  <text x="90" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#FFFFFF">
